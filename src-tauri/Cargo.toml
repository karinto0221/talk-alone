[package]
name = "talk-alone"
version = "1.0.0"
description = "Offline speech and streaming practice"
authors = ["talk-alone"]
edition = "2021"

[lib]
name = "talk_alone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
